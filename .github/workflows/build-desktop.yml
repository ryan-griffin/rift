name: Build Desktop

on:
    push:
        branches: [main]
        paths:
            - "app/**"
            - ".github/workflows/build-desktop.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: build-desktop-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Build ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      bundles: deb,rpm
                    - os: windows-latest
                      bundles: msi
        steps:
            - uses: actions/checkout@v7

            - name: Install system dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev \
                      libgtk-3-dev \
                      libsoup-3.0-dev \
                      libjavascriptcoregtk-4.1-dev \
                      librsvg2-dev \
                      patchelf

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: app/src-tauri -> target

            - uses: oven-sh/setup-bun@v2

            - name: Cache bun dependencies
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.bun/install/cache
                      app/node_modules
                  key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile
              working-directory: app

            - name: Build
              run: bun run tauri build --bundles ${{ matrix.bundles }}
              working-directory: app

            - name: Upload Linux artifacts
              if: runner.os == 'Linux'
              uses: actions/upload-artifact@v7
              with:
                  name: desktop-linux
                  path: |
                      app/src-tauri/target/release/bundle/deb/*.deb
                      app/src-tauri/target/release/bundle/rpm/*.rpm
                  if-no-files-found: error
                  retention-days: 14

            - name: Upload Windows artifacts
              if: runner.os == 'Windows'
              uses: actions/upload-artifact@v7
              with:
                  name: desktop-windows
                  path: app/src-tauri/target/release/bundle/msi/*.msi
                  if-no-files-found: error
                  retention-days: 14
